name: AVR Bare-Metal Firmware CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-firmware:
    name: Build and Verify All AVR Firmware Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install AVR GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr make

      - name: Display Toolchain Versions
        run: |
          avr-gcc --version
          avr-size --version
          make --version

      - name: Compile 01_gpio_blink Example
        run: |
          make EXAMPLE_DIR=firmware/examples/01_gpio_blink clean
          make EXAMPLE_DIR=firmware/examples/01_gpio_blink all
          make EXAMPLE_DIR=firmware/examples/01_gpio_blink size
          test -f firmware/examples/01_gpio_blink/build/main.hex

      - name: Compile 02_gpio_input Example
        run: |
          make EXAMPLE_DIR=firmware/examples/02_gpio_input clean
          make EXAMPLE_DIR=firmware/examples/02_gpio_input all
          make EXAMPLE_DIR=firmware/examples/02_gpio_input size
          test -f firmware/examples/02_gpio_input/build/main.hex

      - name: Compile 03_gpio_debounce Example
        run: |
          make EXAMPLE_DIR=firmware/examples/03_gpio_debounce clean
          make EXAMPLE_DIR=firmware/examples/03_gpio_debounce all
          make EXAMPLE_DIR=firmware/examples/03_gpio_debounce size
          test -f firmware/examples/03_gpio_debounce/build/main.hex

      - name: Compile 04_external_interrupt Example
        run: |
          make EXAMPLE_DIR=firmware/examples/04_external_interrupt clean
          make EXAMPLE_DIR=firmware/examples/04_external_interrupt all
          make EXAMPLE_DIR=firmware/examples/04_external_interrupt size
          test -f firmware/examples/04_external_interrupt/build/main.hex

      - name: Compile 05_timer0_ctc Example
        run: |
          make EXAMPLE_DIR=firmware/examples/05_timer0_ctc clean
          make EXAMPLE_DIR=firmware/examples/05_timer0_ctc all
          make EXAMPLE_DIR=firmware/examples/05_timer0_ctc size
          test -f firmware/examples/05_timer0_ctc/build/main.hex

      - name: Compile 06_timer1_pwm Example
        run: |
          make EXAMPLE_DIR=firmware/examples/06_timer1_pwm clean
          make EXAMPLE_DIR=firmware/examples/06_timer1_pwm all
          make EXAMPLE_DIR=firmware/examples/06_timer1_pwm size
          test -f firmware/examples/06_timer1_pwm/build/main.hex

      - name: Compile 07_adc_pwm Example
        run: |
          make EXAMPLE_DIR=firmware/examples/07_adc_pwm clean
          make EXAMPLE_DIR=firmware/examples/07_adc_pwm all
          make EXAMPLE_DIR=firmware/examples/07_adc_pwm size
          test -f firmware/examples/07_adc_pwm/build/main.hex

      - name: Verify All Generated HEX Artifacts
        run: |
          echo "All firmware examples compiled and verified successfully."
